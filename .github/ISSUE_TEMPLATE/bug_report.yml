name: Bug report
description: sshuttle2 does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove addresses, host names and user names you do not want public. Security problems go through [SECURITY.md](https://github.com/allwinpower/sshuttle2/blob/main/SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: sshuttle2 version
      description: Output of `sshuttle2 --version`.
      placeholder: sshuttle2 0.2.0
    validations:
      required: true
  - type: input
    id: client-os
    attributes:
      label: Client OS
      placeholder: macOS 15.5, Apple Silicon
    validations:
      required: true
  - type: input
    id: server-os
    attributes:
      label: Server OS
      placeholder: Ubuntu 24.04, x86_64
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Method
      options:
        - tun
        - pf
        - nft
        - socks5
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output with -vv
      description: Run the same command with `-vv` and paste the output.
      render: text
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
