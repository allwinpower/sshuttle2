version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # A new release waits a week before its update, so a compromised one
    # has time to be caught and yanked. Security updates do not wait.
    cooldown:
      default-days: 7
    # Vendored with a patch, outside the workspace; updated by hand.
    exclude-paths:
      - "third_party/**"
    ignore:
      - dependency-name: ipstack
    # One pull request for minor and patch updates, one for major ones.
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
