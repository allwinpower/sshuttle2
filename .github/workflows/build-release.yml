name: Release build

# Builds every release file into the artifact "release" (notes into
# "release-notes"), then installs them on several Linux distributions.
# release.yml runs this for a version tag and publishes the result. ci.yml
# runs it for pull requests that touch the release build, so a broken one
# shows up before a tag does. Run it by hand to try a branch: it publishes
# nothing.
#
# Third-party actions are pinned by commit: what they run ends up in the
# release files.
on:
  workflow_call:
    outputs:
      version:
        description: The version in Cargo.toml
        value: ${{ jobs.check.outputs.version }}
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: 2.47.0

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        name: Version, and for a tag that it matches
        run: |
          set -euo pipefail
          # The first top-level `version =` in Cargo.toml is [workspace.package]'s.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
              exit 1
            fi
            if ! grep -q "^## \[${version%%-*}\] - [0-9]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md: the ${version%%-*} section needs a date"
              exit 1
            fi
          fi
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/release-notes.sh "$VERSION" >notes.md && cat notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  # The servers (static Linux, and macOS, all cross-built with zig), built
  # once: every client of a version embeds the same four, so they all share
  # one upload on the remote host.
  servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          # Release builds start clean; and saving the cache looks up zig's
          # version list online after the build, which can fail on its own.
          use-cache: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-zigbuild
      - run: cargo xtask servers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: servers
          path: dist/server/
          if-no-files-found: error

  # Static (musl) clients, each built on its own CPU so it can be run.
  linux:
    name: linux (${{ matrix.nfpm }})
    needs: [check, servers]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            nfpm: x86_64
            nfpm-sha256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            nfpm: arm64
            nfpm-sha256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH=$HOME/.cargo/bin:$PATH
          fi
          rustup show active-toolchain || rustup toolchain install
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          # Release builds start clean; and saving the cache looks up zig's
          # version list online after the build, which can fail on its own.
          use-cache: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-zigbuild
      - name: nfpm
        env:
          FILE: nfpm_${{ env.NFPM_VERSION }}_Linux_${{ matrix.nfpm }}.tar.gz
          SHA256: ${{ matrix.nfpm-sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/$FILE"
          echo "$SHA256  $FILE" | sha256sum -c -
          tar -xzf "$FILE" nfpm
          sudo install -m 755 nfpm /usr/local/bin/nfpm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: servers
          path: dist/server
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cargo xtask client "$TARGET"
          "target/$TARGET/release/sshuttle2" --version
          cargo xtask package "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: files-linux-${{ matrix.nfpm }}
          path: dist/sshuttle2*
          if-no-files-found: error

  # Both macOS clients on one Apple Silicon runner. Linking on macOS gives
  # the arm64 binary the ad-hoc signature it needs to run.
  macos:
    needs: [check, servers]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: servers
          path: dist/server
      - name: Build and package
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo xtask client "$target"
            cargo xtask package "$target"
          done
          target/aarch64-apple-darwin/release/sshuttle2 --version
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 target/x86_64-apple-darwin/release/sshuttle2 --version
          else
            echo "::notice::No Rosetta on this runner, so the x86_64 build was not run"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: files-macos
          path: dist/sshuttle2*
          if-no-files-found: error

  assemble:
    needs: [check, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: files-*
          merge-multiple: true
          path: dist
      - name: Source archive, install script, checksums
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="sshuttle2-$VERSION/" -o "dist/sshuttle2-$VERSION-src.tar.gz" HEAD
          cp packaging/install.sh dist/
          cd dist
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
          # 4 tarballs, 2 .deb, 2 .rpm, the source archive, install.sh, and
          # for a final version 2 Arch packages
          want=12
          [[ $VERSION == *-* ]] && want=10
          [ "$(wc -l <SHA256SUMS)" -eq "$want" ] || { echo "::error::expected $want release files"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: dist/
          if-no-files-found: error

  install-test:
    needs: [check, assemble]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable", "ubuntu:24.04", "fedora:latest", "almalinux:9", "archlinux:latest", "alpine:latest"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: dist
      - env:
          VERSION: ${{ needs.check.outputs.version }}
          IMAGE: ${{ matrix.image }}
        run: >-
          docker run --rm -e VERSION
          -v "$PWD/dist:/dist:ro" -v "$PWD/packaging:/packaging:ro"
          "$IMAGE" sh /packaging/install-test.sh

  # The formula from this build's files, audited, installed and tested with
  # Homebrew as `brew install allwinpower/tap/sshuttle2` will use it.
  homebrew-test:
    needs: [check, assemble]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Homebrew reads the version from the URL, so the files sit under
      # v$VERSION/ as they do in a GitHub release.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: ${{ runner.temp }}/download/v${{ needs.check.outputs.version }}
      - env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # Homebrew is on the Linux runners too, but not on their PATH.
          command -v brew >/dev/null || eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          files=$RUNNER_TEMP/download/v$VERSION
          brew tap-new --no-git local/test
          formula=$(brew --repository local/test)/Formula/sshuttle2.rb
          # Audit the formula as it will be published...
          packaging/homebrew/formula.sh "$VERSION" "$files/SHA256SUMS" >"$formula"
          cat "$formula"
          brew audit --strict --formula local/test/sshuttle2
          # The formula has no version line: Homebrew reads it from the
          # GitHub release URLs, and must read exactly this one.
          read_version=$(brew info --json=v2 local/test/sshuttle2 | jq -r '.formulae[0].versions.stable')
          if [ "$read_version" != "$VERSION" ]; then
            echo "::error::Homebrew reads version $read_version from the release URLs, not $VERSION"
            exit 1
          fi
          # ...then install it from this build's files. A file:// URL tells
          # Homebrew no version, so formula.sh states it there.
          packaging/homebrew/formula.sh "$VERSION" "$files/SHA256SUMS" "file://$files" >"$formula"
          brew install --formula local/test/sshuttle2
          brew test local/test/sshuttle2
          sshuttle2 --version

  # The AUR package (sshuttle2-bin), built with makepkg and installed on Arch
  # Linux from this build's files. Final versions only: a PKGBUILD's pkgver
  # cannot hold a prerelease.
  aur-test:
    needs: [check, assemble]
    if: ${{ !contains(needs.check.outputs.version, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: dist
      - env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          pkg=$RUNNER_TEMP/aur
          mkdir -p "$pkg"
          packaging/aur/pkgbuild.sh "$VERSION" dist/SHA256SUMS >"$pkg/PKGBUILD"
          # Not published yet: makepkg takes the tarball from here.
          cp "dist/sshuttle2-$VERSION-linux-amd64.tar.gz" "$pkg/"
          docker run --rm -e VERSION -v "$pkg:/pkg" -v "$PWD:/src:ro" archlinux:latest \
            bash /src/packaging/aur/check.sh /pkg
