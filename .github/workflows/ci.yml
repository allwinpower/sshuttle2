name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    # Every push to main, and every pull request that touches code. Without
    # a status function, a skipped release-files (every push) would skip
    # this too; it also runs if release-files failed, so a broken diff never
    # hides code.
    needs: release-files
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.release-files.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml on the first cargo call; this makes
      # the install its own step so its time does not hide inside "fmt".
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: shellcheck packaging/*.sh packaging/*/*.sh scripts/speedtest/*.sh
      # The speed test report, against a saved run.
      - run: |
          python3 scripts/speedtest/report.py scripts/speedtest/testdata/results.jsonl \
            --layout scripts/speedtest/testdata/layout.json | diff scripts/speedtest/testdata/results.md -
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --locked
      # End to end: the servers (Linux and macOS), a client embedding them, then
      # real transfers through a local server and over ssh into a container.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-zigbuild@0.24.0
      - run: cargo xtask dist
      - run: scripts/e2e.sh local
      - run: scripts/e2e.sh docker
      # Tun mode, in containers: a static client (musl) that runs on Alpine.
      - run: |
          rustup target add x86_64-unknown-linux-musl
          SSHUTTLE2_SERVER_DIR=$PWD/dist/server cargo zigbuild --locked --release -p sshuttle2 --target x86_64-unknown-linux-musl
      - run: scripts/e2e-tun.sh
      # nft mode, in containers. Its rules need nft_redir and nft_fib_inet;
      # load them up front in case the kernel does not load them on demand
      # for a request from inside a container.
      - run: sudo modprobe -a nft_chain_nat nft_redir nft_fib_inet || true
      - run: scripts/e2e-nft.sh
      # The speed test's client side, every mode, with a stand-in for
      # Ookla's CLI (the real test: .github/workflows/speedtest.yml).
      - run: scripts/speedtest/dry-run.sh

  macos:
    # Runs when linux does. Lints and unit tests only: the end-to-end tests
    # need Docker, which macOS runners lack.
    needs: release-files
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.release-files.outputs.code != 'false') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  msrv:
    # The oldest Rust the workspace supports: rust-version in Cargo.toml.
    needs: release-files
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.release-files.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --workspace

  deny:
    # Advisories, licenses and sources of every dependency; see deny.toml.
    needs: release-files
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.release-files.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  zizmor:
    # The workflows themselves: template injection, broad permissions,
    # persisted credentials, unpinned or known-bad actions. Low-severity
    # findings are only reported.
    needs: release-files
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.release-files.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          min-severity: medium
          advanced-security: false

  release-files:
    # What this pull request touches. changed: the release build, so
    # release-build runs, as it needs macOS and arm64 runners. code:
    # anything but docs, so linux, macos, msrv, deny and zizmor run; false only when
    # every file is on the short list below (testdata .md files are not:
    # linux diffs them).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        run: |
          set -euo pipefail
          # HEAD is the merge commit; its first parent is the base branch.
          # No renames: a file moved into docs/ still lists where it left.
          git diff --no-renames --name-only HEAD^1 HEAD | tee changed.txt
          if grep -qE '^(\.github/workflows/(build-release|release)\.yml|packaging/|xtask/|crates/client/build\.rs|Cargo\.(toml|lock)|rust-toolchain\.toml|CHANGELOG\.md)' changed.txt; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi
          if [ ! -s changed.txt ] || grep -qvE '^(docs/|README\.md$|TODO\.md$|LICENSE|\.gitignore$)' changed.txt; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  release-build:
    # Every release file, built and installed as a tag would, without
    # publishing.
    needs: release-files
    if: needs.release-files.outputs.changed == 'true'
    uses: ./.github/workflows/build-release.yml

  ci-required:
    # The one job everything else hangs off, and the check branch protection
    # requires: GitHub auto-merge waits for it. A skipped job reports
    # success, so the gate checks each result itself.
    needs: [linux, macos, msrv, deny, zizmor, release-files, release-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything upstream did not succeed
        env:
          FILES: ${{ needs.release-files.result }}
          BUILD: ${{ needs.release-build.result }}
          CODE: ${{ needs.release-files.outputs.code }}
          CHECKS: >-
            linux=${{ needs.linux.result }}
            macos=${{ needs.macos.result }}
            msrv=${{ needs.msrv.result }}
            deny=${{ needs.deny.result }}
            zizmor=${{ needs.zizmor.result }}
        run: |
          set -euo pipefail
          echo "release-files=$FILES"
          echo "release-build=$BUILD"
          echo "code=$CODE"
          # linux, macos, msrv, deny and zizmor may skip only a pull request that
          # release-files saw touch nothing but docs.
          for job in $CHECKS; do
            echo "$job"
            case "${job#*=}/$FILES/$CODE" in
              success/*/* | skipped/success/false) ;;
              *) exit 1 ;;
            esac
          done
          # release-files runs for pull requests only; release-build only
          # when it says so.
          case "$FILES/$BUILD" in
            success/success | success/skipped | skipped/skipped) ;;
            *) exit 1 ;;
          esac
