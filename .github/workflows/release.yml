name: Release

# A version tag (v0.2.0, or v0.2.0-rc.1 for a prerelease) builds and tests
# every release file with build-release.yml, publishes the GitHub Release,
# and for a final release updates the Homebrew formula. docs/RELEASING.md
# has the steps.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-release.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      id-token: write # signing the attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Upload into a draft, then publish, so no one sees a release with
          # half its files. A rerun finds its own draft and fills it; a
          # published release is never changed.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            [[ $VERSION == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" --verify-tag --draft "${flags[@]}" \
              --title "sshuttle2 $VERSION" --notes-file notes.md dist/*
          fi
          gh release edit "$TAG" --draft=false

  # Final releases only: `brew install` should never get a prerelease.
  homebrew:
    needs: [build, publish]
    if: ${{ !contains(needs.build.outputs.version, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Update the formula in allwinpower/homebrew-tap
        env:
          # A fine-grained token: contents read and write, on the tap only.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          packaging/homebrew/formula.sh "$VERSION" dist/SHA256SUMS >"$RUNNER_TEMP/sshuttle2.rb"
          tap=$RUNNER_TEMP/tap
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/allwinpower/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula"
          cp "$RUNNER_TEMP/sshuttle2.rb" "$tap/Formula/sshuttle2.rb"
          cd "$tap"
          git add Formula/sshuttle2.rb
          if git diff --cached --quiet; then
            echo "The tap already has sshuttle2 $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "sshuttle2 $VERSION"
          git push origin HEAD:main
