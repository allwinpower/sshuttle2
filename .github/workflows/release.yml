name: Release

# A version tag (v0.2.0, or v0.2.0-rc.1 for a prerelease) builds and tests
# every release file with build-release.yml, then publishes the GitHub
# Release. docs/RELEASING.md has the steps.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-release.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      id-token: write # signing the attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Upload into a draft, then publish, so no one sees a release with
          # half its files. A rerun finds its own draft and fills it; a
          # published release is never changed.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            [[ $VERSION == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" --verify-tag --draft "${flags[@]}" \
              --title "sshuttle2 $VERSION" --notes-file notes.md dist/*
          fi
          gh release edit "$TAG" --draft=false
