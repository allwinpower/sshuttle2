[package]
name = "sshuttle2"
description = "A VPN over a plain SSH login, written in Rust and inspired by sshuttle"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sshuttle2-core.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap = { version = "4", features = ["derive"] }
etherparse = "0.21"
ipstack = "1"
libc.workspace = true
nix = { version = "0.31", features = ["socket", "uio"] }
sha2.workspace = true
shlex = "1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Tun mode's addresses and routes, without iproute2.
[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"

# musl's allocator is slow: on one CPU core the musl client moved 20-25%
# less data than a glibc build and used 1.8 times the CPU.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"
