# .deb, .rpm and Arch (.pkg.tar.zst) packages of a release client.
# `cargo xtask package TARGET` runs nfpm with VERSION, ARCH (amd64 or arm64)
# and BINARY set; nfpm names the architecture the rpm and Arch way (x86_64,
# aarch64) itself.
name: sshuttle2
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: "1"
section: net
priority: optional
maintainer: Allwin <111454915+allwinpower@users.noreply.github.com>
homepage: https://github.com/allwinpower/sshuttle2
license: LGPL-2.1-or-later
description: |-
  A VPN over a plain SSH login.
  If you can log in to a server with SSH, sshuttle2 sends your traffic
  through it: TCP, all UDP, DNS and IPv6. Nothing is installed on
  the server and it needs no root there.

contents:
  - src: ${BINARY}
    dst: /usr/bin/sshuttle2
    expand: true
    file_info:
      mode: 0755
  - src: README.md
    dst: /usr/share/doc/sshuttle2/README.md
  # Written by `cargo xtask package` (see `cargo xtask docs`).
  - src: target/xtask/docs/doc/sshuttle2.1
    dst: /usr/share/man/man1/sshuttle2.1
  - src: target/xtask/docs/complete/sshuttle2.bash
    dst: /usr/share/bash-completion/completions/sshuttle2
  - src: target/xtask/docs/complete/_sshuttle2
    dst: /usr/share/zsh/site-functions/_sshuttle2
  - src: target/xtask/docs/complete/sshuttle2.fish
    dst: /usr/share/fish/vendor_completions.d/sshuttle2.fish
  # Debian keeps license texts in the doc directory; RPM and Arch keep them in
  # /usr/share/licenses.
  - src: LICENSE
    dst: /usr/share/doc/sshuttle2/copyright
    packager: deb
  - src: third_party/ipstack/LICENSE
    dst: /usr/share/doc/sshuttle2/LICENSE-ipstack
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/sshuttle2/LICENSE
    type: license
    packager: rpm
  - src: third_party/ipstack/LICENSE
    dst: /usr/share/licenses/sshuttle2/LICENSE-ipstack
    type: license
    packager: rpm
  - src: LICENSE
    dst: /usr/share/licenses/sshuttle2/LICENSE
    packager: archlinux
  - src: third_party/ipstack/LICENSE
    dst: /usr/share/licenses/sshuttle2/LICENSE-ipstack
    packager: archlinux

archlinux:
  packager: Allwin <111454915+allwinpower@users.noreply.github.com>

# The client runs the user's ssh. Firewall modes need root (sudo or doas);
# nft mode needs the nft command. The SOCKS5 proxy needs neither. (nfpm
# writes no optional dependencies into Arch packages.)
overrides:
  deb:
    depends:
      - openssh-client
    recommends:
      - nftables
      - sudo
  rpm:
    depends:
      - openssh-clients
    recommends:
      - nftables
      - sudo
  archlinux:
    depends:
      - openssh
